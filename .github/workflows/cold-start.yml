name: cold-start

# Cold-start verification: can a new user install this plugin on a machine that
# has never seen it, and does the install actually load?
#
# This is deliberately separate from the unit tests: those prove the plugin's
# own logic, this proves the *distribution path* — `dsh plugin add` against a
# throwaway DSH_HOME, the prepare/allowBuilds gate, the composed profile tree,
# and a real bridge call into a real core.  No model is called, so it runs on
# every push without credentials.
#
# The host toolchain is pinned exactly (see HOST_* below): a floating DSH or
# pnpm would make a green run unreproducible.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cold-start-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so a run can be reproduced verbatim.  Bump these deliberately.
  # HOST_DSH is overridden per matrix entry below; the others are fixed.
  HOST_PNPM: "pnpm@11.22.0"
  HOST_NODE: "22.22.2"
  HOST_PYTHON: "3.13"

jobs:
  linux-cold-start:
    name: linux cold-start (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # `github` installs what a user gets from the repository; `file` is the
        # documented local-checkout path.  They exercise different pnpm
        # dependency kinds (git tarball vs file:), and only `github` can fail
        # because of the prepare-script allowlist.
        #
        # The 0.2.0-rc.2 entry is here because the peer-range bug that motivated
        # all of this was invisible on the version CI pinned: the plugin
        # installed fine on 0.1.5-rc.3 and could not be installed at all on the
        # `next` channel users are actually on.  Pinning the harness is not the
        # same as covering the harnesses; one row per channel is the difference.
        include:
          - { install: github, dsh: "0.1.5-rc.3", label: github-015 }
          - { install: file,   dsh: "0.1.5-rc.3", label: file-015 }
          - { install: file,   dsh: "0.2.0-rc.2", label: file-020 }
          - { install: file,   dsh: "0.2.1-rc.5", label: file-0211rc5 }
          - { install: file,   dsh: "0.2.2-alpha.2", label: file-0222a2 }
    steps:
      - name: Check out the plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Check out the core
        uses: actions/checkout@v4
        with:
          repository: HarryHeYu/sessionFlow
          path: core

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.HOST_NODE }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.HOST_PYTHON }}

      - name: Install the pinned host toolchain
        env:
          HOST_DSH: "@deepseek-ai/dsh@${{ matrix.dsh }}"
        run: |
          npm install -g "$HOST_DSH" "$HOST_PNPM"
          echo "--- pinned versions ---"
          node --version
          npm --version
          pnpm --version
          dsh --version
          # The matrix row is a claim about which harness was exercised.  If the
          # install resolved something else, the row would be a lie, so check it.
          dsh --version | grep -qF "${{ matrix.dsh }}" || {
            echo "dsh --version did not report ${{ matrix.dsh }}" >&2
            exit 1
          }

      - name: Assert the machine is a clean slate
        run: |
          set -euo pipefail
          # The whole point is that nothing is pre-installed.  If a runner image
          # ever ships a `voyager`, this test would be lying, so refuse to run.
          if command -v voyager >/dev/null 2>&1; then
            echo "voyager is already on PATH — this runner is not a clean slate" >&2
            exit 1
          fi
          if [ -e "$HOME/.dsh/profiles" ]; then
            echo "~/.dsh/profiles already exists — not a clean slate" >&2
            exit 1
          fi
          echo "clean slate: no voyager, no ~/.dsh/profiles"

      - name: Install the core from source (the documented path)
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # `pip install -e .` — the README's command.  The core declares zero
          # required dependencies, so this is the minimal install a user gets.
          python -m pip install -e ./core
          echo "--- voyager --help ---"
          voyager --help | head -5
          echo "--- a fresh database works ---"
          voyager stats --db "$RUNNER_TEMP/cold.db"
          echo "--- the plugin can see the core ---"
          voyager integration-info --json

      - name: Build the plugin (local-checkout path only)
        if: matrix.install == 'file'
        working-directory: plugin
        run: |
          set -euo pipefail
          # The README tells local users to build before adding.  The `github`
          # job deliberately skips this so the prepare-script path is exercised.
          npm ci
          npm run build

      - name: Run the cold-start checks
        env:
          COLD_ROOT: ${{ runner.temp }}/cold-${{ matrix.label }}
        run: |
          set -euo pipefail
          SPEC="github:HarryHeYu/dsh-sessionflow"
          if [ "${{ matrix.install }}" = "file" ]; then
            SPEC="file:$GITHUB_WORKSPACE/plugin"
          fi
          echo "install spec: $SPEC"
          bash plugin/scripts/cold-start.sh "$SPEC" "cold-${{ matrix.label }}" python

      - name: Show what was installed
        if: always()
        env:
          COLD_ROOT: ${{ runner.temp }}/cold-${{ matrix.label }}
        run: |
          set -uo pipefail
          P="$COLD_ROOT/dshhome/profiles/cold-${{ matrix.label }}"
          echo "--- profile dir ---"
          ls -la "$P" 2>/dev/null || true
          echo "--- pnpm-workspace.yaml ---"
          cat "$P/pnpm-workspace.yaml" 2>/dev/null || true
          echo "--- dependency kind ---"
          node -e 'const j=require(process.argv[1]);console.log(JSON.stringify(j.dependencies??{},null,2))' \
            "$P/package.json" 2>/dev/null || true
          echo "--- installed plugin ---"
          ls -la "$P/node_modules/dsh-sessionflow/lib" 2>/dev/null || true

      - name: Clean up the scratch root
        if: always()
        env:
          COLD_ROOT: ${{ runner.temp }}/cold-${{ matrix.label }}
        run: rm -rf "$COLD_ROOT"

  plugin-tests:
    # The offline suite, on Linux: the bridge mechanics (BAD_JSON, TIMEOUT,
    # CLI_FAILED, INCOMPATIBLE) and the six-tool surface, proven off Windows.
    # The core is installed so the `integration`-guarded tests actually run
    # here rather than skipping — otherwise this job would silently prove less
    # on Linux than it does on a developer's machine.
    name: plugin tests on linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin

      - name: Check out the core
        uses: actions/checkout@v4
        with:
          repository: HarryHeYu/sessionFlow
          path: core

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.HOST_NODE }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.HOST_PYTHON }}

      - name: Install the core from source
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./core

      - name: Build and test
        working-directory: plugin
        run: |
          npm ci
          npm run build
          npm test

      - name: Peer range vs the live registry (non-blocking)
        # Informational only.  The blocking gate is the pinned host list in
        # tests/peer-range.test.ts, which needs no network.  This step asks the
        # other question -- has a dist-tag moved since we pinned that list? --
        # and must never fail the build, because a floating registry is exactly
        # the kind of thing that would turn CI red for reasons that are not ours.
        continue-on-error: true
        working-directory: plugin
        run: npm run check:peer-range

      - name: Pack (dry run — nothing is published)
        working-directory: plugin
        run: npm pack --dry-run

  install-ref-semantics:
    # The README now pins `github:owner/repo#<published tag>`. Prove the three
    # pnpm shorthand forms against the live repository on Linux with the
    # stock CA bundle: no GIT_SSL_NO_VERIFY and no alternative TLS backend.
    # This is the package-manager layer only; it does not launch DSH or a model.
    name: "github: ref resolution (linux)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: noref, ref: '', expect: branch }
          - { label: tag, ref: '#v1.3.0', expect: tag }
          - { label: sha, ref: '#72b9328033985afd28f6f8b9924925e8ff1c3672', expect: sha }
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2

      - name: Install the pinned pnpm
        run: npm install -g pnpm@11.22.0

      - name: Refuse a TLS-verification bypass
        run: |
          set -euo pipefail
          if [ -n "${GIT_SSL_NO_VERIFY:-}" ]; then
            echo "GIT_SSL_NO_VERIFY must not be set for this gate" >&2
            exit 1
          fi
          if [ "$(git config --get http.sslVerify || true)" = "false" ]; then
            echo "http.sslVerify=false must not be used for this gate" >&2
            exit 1
          fi
          echo "certificate verification: default CA bundle, sslVerify not disabled"

      - name: Resolve and assert the installed commit
        env:
          PROBE_ROOT: ${{ runner.temp }}/ref-${{ matrix.label }}
          SPEC_REF: ${{ matrix.ref }}
          EXPECT: ${{ matrix.expect }}
        run: |
          set -euo pipefail
          mkdir -p "$PROBE_ROOT"
          cd "$PROBE_ROOT"
          SPEC="github:HarryHeYu/dsh-sessionflow${SPEC_REF}"
          echo "install spec: $SPEC"
          node - "$SPEC" <<'NODE'
          const fs = require('node:fs');
          const spec = process.argv[2];
          fs.writeFileSync('package.json', JSON.stringify({
            name: 'dsh-install-ref-probe',
            version: '1.0.0',
            private: true,
            dependencies: { 'dsh-sessionflow': spec }
          }, null, 2) + '\n');
          NODE
          pnpm install --ignore-scripts --config.auto-install-peers=false --store-dir "$PROBE_ROOT/store"

          RESOLVED=$(node -e '
          const fs = require("node:fs");
          const lock = fs.readFileSync("pnpm-lock.yaml", "utf8");
          const m = /tar\.gz\/([0-9a-f]{40})/.exec(lock);
          if (!m) { console.error("resolved commit not found in pnpm-lock.yaml"); process.exit(1); }
          process.stdout.write(m[1]);
          ')
          case "$EXPECT" in
            branch)
              EXPECTED=$(git ls-remote https://github.com/HarryHeYu/dsh-sessionflow.git refs/heads/main | awk '{print $1}')
              ;;
            tag)
              EXPECTED=$(git ls-remote https://github.com/HarryHeYu/dsh-sessionflow.git 'refs/tags/v1.3.0^{}' | awk '{print $1}')
              ;;
            sha)
              EXPECTED=72b9328033985afd28f6f8b9924925e8ff1c3672
              ;;
            *)
              echo "unknown EXPECT=$EXPECT" >&2
              exit 1
              ;;
          esac
          echo "resolved=$RESOLVED"
          echo "expected=$EXPECTED"
          test "$RESOLVED" = "$EXPECTED"
